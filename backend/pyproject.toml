[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "food-store-backend"
version = "0.1.0"
description = "Food Store backend foundation"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.29.0",
  "bcrypt>=5.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pydantic-settings>=2.6.0",
  "python-jose[cryptography]>=3.3.0",
  "sqlalchemy>=2.0.36",
  "sqlmodel>=0.0.22",
  "structlog>=24.4.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
